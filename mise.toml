[tools]
java = "temurin-21"

[tasks.start]
description = "Run the application using Gradle wrapper"
run = "./gradlew bootRun"

[tasks.check]
description = "Run Gradle wrapper check"
run = '''./gradlew check'''

[tasks.test]
description = "Run Gradle wrapper unit tests"
usage = '''
arg "[test-class]" help="Optional fully-qualified test class name or pattern"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ -n "${usage_test_class:-}" ]]; then
  ./gradlew test --tests "${usage_test_class}"
else
  ./gradlew test
fi
'''

[tasks.integration-test]
description = "Run Gradle wrapper integration tests"
usage = '''
arg "[test-class]" help="Optional fully-qualified integration test class name or pattern"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ -n "${usage_test_class:-}" ]]; then
  ./gradlew integrationTest --tests "${usage_test_class}"
else
  ./gradlew integrationTest
fi
'''
